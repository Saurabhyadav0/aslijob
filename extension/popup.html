<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AsliJob — Scam Checker</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      font-weight: 900;
      font-size: 16px;
      color: #ffffff;
    }
    .brand span {
      color: #38bdf8;
    }
    .badge {
      font-size: 10px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      height: 90px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #f8fafc;
      padding: 10px;
      font-size: 12px;
      resize: none;
      outline: none;
      margin-bottom: 10px;
    }
    textarea:focus {
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover {
      background: #0369a1;
    }
    .result {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 12px;
      font-size: 11px;
    }
    .result.scam {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #f43f5e;
    }
    .result.suspicious {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #f59e0b;
    }
    .result.safe {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #10b981;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">Asli<span>Job</span></div>
    <span class="badge">Extension</span>
  </div>
  <textarea id="text" placeholder="Paste job message, recruiter number, or UPI..."></textarea>
  <button id="checkBtn">🔍 Check Offer</button>
  <div id="result" class="result"></div>
  <script src="popup.js"></script>
</body>
</html>
